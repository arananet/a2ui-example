# =============================================================================
# Railway Deployment Configuration
# =============================================================================
# https://docs.railway.app/reference/config-as-code
#
# IMPORTANT: In the Railway dashboard, set the "Root Directory" of your
# service to "version-2" for the cleanest build. If you leave the root
# as the repo root, the startCommand below handles the path change.
# =============================================================================

[build]
builder = "nixpacks"

[deploy]
startCommand = "cd version-2 && uvicorn main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
